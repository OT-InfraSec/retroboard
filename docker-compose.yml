services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?set BASIC_AUTH_PASSWORD in .env}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?set GITHUB_TOKEN in .env}
      GITHUB_REPO: ${GITHUB_REPO:?set GITHUB_REPO in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      DATABASE_URL: postgres://retroboard:${POSTGRES_PASSWORD:-retroboard}@db:5432/retroboard
      PORT: "3000"
    volumes:
      - ./config:/app/config:ro

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: retroboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retroboard}
      POSTGRES_DB: retroboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retroboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
